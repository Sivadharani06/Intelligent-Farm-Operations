spring.application.name=farmVerseApplication
server.port=9696
# Database URL pointing to studentdb
spring.datasource.url=jdbc:postgresql://localhost:5432/farmdb
 
# Your PostgreSQL credentials (update these with your system's username and password)
spring.datasource.username=postgres
spring.datasource.password=root
 
# PostgreSQL Driver class
spring.datasource.driver-class-name=org.postgresql.Driver
 
# JPA / Hibernate Configurations
# 'update' will automatically create or update tables based on your Entity classes
spring.jpa.hibernate.ddl-auto=update
 
# Shows the SQL queries in the console (helpful for teaching/debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
 
# Database dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


